name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        cache: false

    - name: Check tag matches version
      run: |
        version="$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')"
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match package version ${version}"
          exit 1
        fi

    - id: auth
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish
      run: cargo publish --features rt-tokio-crypto-rust
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
